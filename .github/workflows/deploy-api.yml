name: Deploy API to Liara

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - '.github/workflows/deploy-api.yml'

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v3
        with:
          version: 9
          
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Type check
        run: pnpm --filter @r6ac/api typecheck
        
      - name: Lint
        run: pnpm --filter @r6ac/api lint
        
      - name: Test
        run: pnpm --filter @r6ac/api test

  deploy:
    name: Deploy to Liara
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Liara CLI
        run: npm install -g @liara/cli
        
      - name: Run database migrations
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile
          pnpm tsx scripts/migrate.ts
          
      - name: Build standalone deploy package
        run: node scripts/prepare-api-standalone.mjs

      - name: Deploy API to Liara
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_TOKEN }}
        run: liara deploy --path deploy/r6ac-api --detach
